name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/tasks

jobs:
  # ============================================
  # JOB 1: Тесты и сборка
  # ============================================
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout кода
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Установка Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      # 3. Загрузка зависимостей
      - name: Download dependencies
        run: go mod download
      
      # 4. Запуск тестов (если есть)
      - name: Run tests
        run: go test -v ./...
      
      # 5. Сборка бинарника (проверка компиляции)
      - name: Build Auth
        run: go build -o /dev/null ./services/auth/cmd/auth
      
      - name: Build Tasks
        run: go build -o /dev/null ./services/tasks/cmd/tasks

  # ============================================
  # JOB 2: Сборка Docker образа
  # ============================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Настройка Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 3. Сборка образа (без публикации)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/tasks/Dockerfile
          load: true
          tags: techip-tasks:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # 4. Проверка, что образ собрался
      - name: Verify image
        run: docker images | grep techip-tasks

  # ============================================
  # JOB 3: Публикация в Registry (опционально)
  # ============================================
  docker-push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix={{date:YYYYMMDDHHmmss}}-
            type=raw,value=latest
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/tasks/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max